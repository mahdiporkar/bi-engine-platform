services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - super-app-ui
      - super-app-superset-ui
      - super-app-backend
      - superset-public
      - superset-operation
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - platform

  super-app-ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${SUPER_APP_UI_PORT:-5173}:5173"
    volumes:
      - ./apps/super-app-ui:/app
    environment:
      VITE_API_BASE_URL: /api
      VITE_SUPERSET_MFE_URL: /superset-mfe
    networks:
      - platform

  super-app-superset-ui:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${SUPER_APP_SUPERSET_UI_PORT:-5174}:5174"
    volumes:
      - ./apps/super-app-superset-ui:/app
    environment:
      VITE_API_BASE_URL: /api
      VITE_SUPERSET_PUBLIC_URL: /superset/public
      VITE_SUPERSET_OPERATION_URL: /api/superset/operation/
    networks:
      - platform

  super-app-backend:
    build:
      context: ./services/super-app-backend
    depends_on:
      - mongo
      - keycloak
    ports:
      - "${BACKEND_PORT:-8090}:8090"
    environment:
      PORT: 8090
      SESSION_SECRET: ${BACKEND_SESSION_SECRET:-local-dev-session-secret-replace-before-shared-use}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:${NGINX_PORT:-8080}/api}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-bi_engine_platform}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:${KEYCLOAK_PORT:-8081}}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-bi-engine}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-super-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-dev-secret}
      OPERATION_KEYCLOAK_BASE_URL: ${OPERATION_KEYCLOAK_BASE_URL:-${KEYCLOAK_BASE_URL:-http://keycloak:8080}}
      OPERATION_KEYCLOAK_REALM: ${OPERATION_KEYCLOAK_REALM:-${KEYCLOAK_REALM:-bi-engine}}
      OPERATION_KEYCLOAK_CLIENT_ID: ${OPERATION_KEYCLOAK_CLIENT_ID:-superset-operation}
      OPERATION_KEYCLOAK_CLIENT_SECRET: ${OPERATION_KEYCLOAK_CLIENT_SECRET:-local-dev-operation-secret}
      OPERATION_KEYCLOAK_TOKEN_EXCHANGE_ENABLED: ${OPERATION_KEYCLOAK_TOKEN_EXCHANGE_ENABLED:-true}
      OPERATION_KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE: ${OPERATION_KEYCLOAK_TOKEN_EXCHANGE_AUDIENCE:-superset-operation}
      OPERATION_KEYCLOAK_TOKEN_EXCHANGE_REQUESTED_ISSUER: ${OPERATION_KEYCLOAK_TOKEN_EXCHANGE_REQUESTED_ISSUER:-}
      OPERATION_KEYCLOAK_TOKEN_EXCHANGE_REQUESTED_TOKEN_TYPE: ${OPERATION_KEYCLOAK_TOKEN_EXCHANGE_REQUESTED_TOKEN_TYPE:-urn:ietf:params:oauth:token-type:access_token}
      SUPERSET_PUBLIC_URL: ${SUPERSET_PUBLIC_URL:-http://superset-public:8088}
      SUPERSET_OPERATION_URL: ${SUPERSET_OPERATION_URL:-http://superset-operation:8088}
      ALLOW_SUPERSET_PROXY_WITHOUT_TOKEN: ${ALLOW_SUPERSET_PROXY_WITHOUT_TOKEN:-false}
    networks:
      - platform

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-bi_engine_platform}
    networks:
      - platform

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-bi-engine.json:/opt/keycloak/data/import/realm-bi-engine.json:ro
    networks:
      - platform

  mock-data-warehouse:
    image: postgres:16
    environment:
      POSTGRES_DB: bi_warehouse
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_password
    volumes:
      - mock-data-warehouse-data:/var/lib/postgresql/data
      - ./infra/mock-data-warehouse/init:/docker-entrypoint-initdb.d:ro
    networks:
      - platform

  superset-public-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset-public-db-data:/var/lib/postgresql/data
    networks:
      - platform

  superset-operation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset-operation-db-data:/var/lib/postgresql/data
    networks:
      - platform

  superset-redis:
    image: redis:7-alpine
    networks:
      - platform

  superset-public:
    image: ${SUPERSET_IMAGE:-bi-engine-superset:local-source}
    build:
      context: "${SUPERSET_SOURCE_DIR:-E:\\Project\\superset}"
      dockerfile: Dockerfile
      target: dev
      args:
        DEV_MODE: "false"
        NPM_BUILD_CMD: build-dev
    depends_on:
      - superset-public-db
      - superset-redis
    command: >
      /bin/sh -c "superset db upgrade &&
      superset fab create-admin --username $$SUPERSET_ADMIN_USERNAME --firstname BI --lastname Admin --email $$SUPERSET_ADMIN_EMAIL --password $$SUPERSET_ADMIN_PASSWORD || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088"
    ports:
      - "${SUPERSET_PUBLIC_PORT:-8088}:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_APP_ROOT: /superset/public
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-local-superset-secret}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.local}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-public-db:5432/superset
      REDIS_HOST: superset-redis
      PUBLIC_BASE_URL: http://localhost:${NGINX_PORT:-8080}/superset/public
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-bi-engine}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-super-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-local-dev-secret}
      SUPERSET_KEYCLOAK_DEFAULT_ROLE: ${SUPERSET_PUBLIC_KEYCLOAK_DEFAULT_ROLE:-Gamma}
      SUPERSET_KEYCLOAK_ADMIN_ROLES: ${SUPERSET_KEYCLOAK_ADMIN_ROLES:-bi-admin,superset-admin}
    volumes:
      - ./infra/superset/public/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./infra/superset/operation/keycloak_proxy_security_manager.py:/app/pythonpath/keycloak_proxy_security_manager.py:ro
    networks:
      - platform

  superset-operation:
    image: ${SUPERSET_IMAGE:-bi-engine-superset:local-source}
    build:
      context: "${SUPERSET_SOURCE_DIR:-E:\\Project\\superset}"
      dockerfile: Dockerfile
      target: dev
      args:
        DEV_MODE: "false"
        NPM_BUILD_CMD: build-dev
    depends_on:
      - mock-data-warehouse
      - superset-operation-db
      - superset-redis
    command: >
      /bin/sh -c "superset db upgrade &&
      superset fab create-admin --username $$SUPERSET_ADMIN_USERNAME --firstname BI --lastname Admin --email $$SUPERSET_ADMIN_EMAIL --password $$SUPERSET_ADMIN_PASSWORD || true &&
      superset init &&
      superset set-database-uri -d \"$$SUPERSET_OPERATION_DWH_DATABASE_NAME\" -u \"$$SUPERSET_OPERATION_DWH_SQLALCHEMY_URI\" &&
      superset run -h 0.0.0.0 -p 8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_APP_ROOT: /api/superset/operation
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-local-superset-secret}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.local}
      SUPERSET_OPERATION_DWH_DATABASE_NAME: ${SUPERSET_OPERATION_DWH_DATABASE_NAME:-Mock Data Warehouse}
      SUPERSET_OPERATION_DWH_SQLALCHEMY_URI: ${SUPERSET_OPERATION_DWH_SQLALCHEMY_URI:-postgresql+psycopg2://bi_user:bi_password@mock-data-warehouse:5432/bi_warehouse}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-operation-db:5432/superset
      REDIS_HOST: superset-redis
      PUBLIC_BASE_URL: http://localhost:${NGINX_PORT:-8080}/superset/operation
      KEYCLOAK_BASE_URL: ${OPERATION_KEYCLOAK_BASE_URL:-${KEYCLOAK_BASE_URL:-http://keycloak:8080}}
      KEYCLOAK_REALM: ${OPERATION_KEYCLOAK_REALM:-${KEYCLOAK_REALM:-bi-engine}}
      KEYCLOAK_CLIENT_ID: ${OPERATION_KEYCLOAK_CLIENT_ID:-superset-operation}
      KEYCLOAK_CLIENT_SECRET: ${OPERATION_KEYCLOAK_CLIENT_SECRET:-local-dev-operation-secret}
      SUPERSET_KEYCLOAK_DEFAULT_ROLE: ${SUPERSET_KEYCLOAK_DEFAULT_ROLE:-Alpha}
      SUPERSET_KEYCLOAK_ADMIN_ROLES: ${SUPERSET_KEYCLOAK_ADMIN_ROLES:-bi-admin,superset-admin}
    volumes:
      - ./infra/superset/operation/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./infra/superset/operation/keycloak_proxy_security_manager.py:/app/pythonpath/keycloak_proxy_security_manager.py:ro
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  mongo-data:
  mock-data-warehouse-data:
  superset-public-db-data:
  superset-operation-db-data:
